name: citadel_classroom
description: Guided classroom CTF for BIP 2026.
publish_to: none
version: 2.0.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  web: ^1.1.1
  path_provider: 2.1.6
  cryptography: 2.7.0
  notes_insights:
    path: third_party/notes_insights
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/partner-config.json
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono.ttf
